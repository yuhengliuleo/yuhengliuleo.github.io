<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Leo</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf7f5;color:#000;line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
.mimo-page{max-width:1440px;margin:0 auto}
.mimo-nav{display:flex;justify-content:space-between;align-items:center;height:72px;padding:0 40px;border-bottom:1px solid #000;background:#faf7f5;position:sticky;top:0;z-index:100}
.mimo-nav-logo{font-size:20px;font-weight:700;letter-spacing:0.05em}
a.mimo-nav-logo{display:inline-block}
.mimo-nav-links{display:flex;gap:32px}
.mimo-nav-links a{font-size:14px;font-weight:600;letter-spacing:0.02em;transition:opacity 0.2s}
.mimo-nav-links a:hover{opacity:0.6}
.mimo-footer{border-top:1px solid #000;padding:32px 80px;text-align:center}
.mimo-footer span{color:#999;font-size:14px}
@media(max-width:768px){.mimo-nav{height:56px;padding:0 16px}.mimo-nav-links{gap:20px}.mimo-footer{padding:24px}}
@media(max-width:430px){.mimo-nav-links{gap:12px}.mimo-nav-links a{font-size:12px}}
  </style>
  
<style>
.mimo-section{border:1px solid #000;width:100%}
.mimo-section-header{background:#faf7f5;border-bottom:1px solid #000;display:flex;align-items:center;gap:80px;padding:60px 80px}
.mimo-section-header h2{color:#000;flex-shrink:0;font-size:64px;font-weight:700}
.mimo-section-header p{color:#333;font-size:20px;line-height:1.9}
.mimo-cat-link{cursor:pointer;background:#faf7f5;border-bottom:1px solid #000;display:flex;transition:all 0.2s;padding:40px 80px}
.mimo-cat-link:last-child{border-bottom:none}
.mimo-cat-link:hover{background:#000}
.mimo-cat-link:hover h3,.mimo-cat-link:hover p{color:#fff}
.mimo-cat-link h3{color:#000;font-size:28px;font-weight:600;margin-bottom:8px;transition:color 0.2s}
.mimo-cat-link p{color:#666;font-size:16px;transition:color 0.2s}
@media(max-width:768px){
  .mimo-section-header{flex-direction:column;gap:24px;padding:40px 24px}.mimo-section-header h2{font-size:40px}
  .mimo-cat-link{padding:28px 24px}.mimo-cat-link h3{font-size:22px}
}
@media(max-width:430px){
  .mimo-section-header h2{font-size:32px}.mimo-cat-link{padding:24px 20px}.mimo-cat-link h3{font-size:20px}
}
</style>

</head>
<body>
<div class="mimo-page">

    <div class="mimo-nav-links">

    </div>
  </nav>
  
<div class="mimo-section">
  <div class="mimo-section-header">
    <h2>分类</h2>
    <p>按主题浏览全部文章</p>
  </div>
  
  
  <a class="mimo-cat-link" href="https://yuhengliuleo.github.io/categories/%E5%AE%9E%E7%94%A8%E5%B0%8F%E7%A8%8B%E5%BA%8F/">
    <div>
      <h3>0</h3>
      <p>3 篇文章 · 3 篇文章</p>
    </div>
  </a>
  
  
  <a class="mimo-cat-link" href="https://yuhengliuleo.github.io/categories/%E6%94%B6%E7%9B%8A%E6%8A%A5%E5%91%8A/">
    <div>

</div>

  <footer class="mimo-footer">
    <span>© 2025-2026 Leo. All Rights Reserved</span>
  </footer>
</div>
</body>
</html>
